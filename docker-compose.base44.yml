services:
  api:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - lifeos_data:/data
    ports:
      - "8000:8000"
    env_file:
      - /run/base44/app.env
    environment:
      - PORT=8000
      - LIFEOS_DB=/data/lifeos.db
      - NODE_NO_WARNINGS=1
    command: ["sh", "-ec", "exec node --watch --watch-path=server server/index.mjs"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\" || (echo 'api: not responding'; exit 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure

  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - API_PROXY_TARGET=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\" || (echo 'web: dev server not responding'; exit 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: on-failure

volumes:
  node_modules:
  lifeos_data:
